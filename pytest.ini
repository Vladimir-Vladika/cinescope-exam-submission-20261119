[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s %(name)s: %(message)s
markers =
    api: tests against the real CineScope API
    public: tests that do not require a privileged account
    admin: tests requiring a SUPER_ADMIN account
    smoke: core successful scenarios
